<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleFin</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cpath%20fill%3D%22%2335c5f4%22%20d%3D%22M476%203.2L12.5%20270.6c-18.1%2010.4-15.8%2035.6%202.2%2043.2L121%20358.4l287.3-253.2c5.5-4.9%2013.3%202.6%208.6%208.3L176%20407v80.5c0%2023.6%2028.5%2032.9%2042.5%2015.8L282%20426l124.6%2052.2c14.2%206%2030.4-2.9%2033-18.2l72-432C515%207.8%20493.3-6.8%20476%203.2z%22/%3E%3C/svg%3E" />
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <svg viewBox="0 0 512 512" width="20" height="20" fill="currentColor"><path d="M476 3.2L12.5 270.6c-18.1 10.4-15.8 35.6 2.2 43.2L121 358.4l287.3-253.2c5.5-4.9 13.3 2.6 8.6 8.3L176 407v80.5c0 23.6 28.5 32.9 42.5 15.8L282 426l124.6 52.2c14.2 6 30.4-2.9 33-18.2l72-432C515 7.8 493.3-6.8 476 3.2z"/></svg>
    </div>
    <label class="header-search">
      <svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor"><path d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6.1-34zM208 336c-70.7 0-128-57.2-128-128 0-70.7 57.2-128 128-128 70.7 0 128 57.2 128 128 0 70.7-57.2 128-128 128z"/></svg>
      <input type="search" id="search" placeholder="Search" autocomplete="off" />
    </label>
    <div class="conn" id="conn">
      <span class="dot"></span><span id="conn-label">connecting…</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="nav-group active">
        <button class="nav-parent" id="nav-parent">
          <svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor"><path d="M504 255.531c.253 136.64-111.18 248.372-247.82 248.468-59.015.042-113.223-20.53-155.822-54.911-11.077-8.94-11.905-25.541-1.839-35.607l11.267-11.267c8.609-8.609 22.353-9.551 31.891-1.984C173.062 425.135 212.781 440 256 440c101.705 0 184-82.311 184-184 0-101.705-82.311-184-184-184-48.814 0-93.149 18.969-126.068 49.932l50.754 50.754c10.08 10.08 2.941 27.314-11.313 27.314H24c-8.837 0-16-7.163-16-16V38.627c0-14.254 17.234-21.393 27.314-11.314l49.372 49.372C129.209 34.136 189.552 8 256 8c136.81 0 247.747 110.78 248 247.531zm-180.912 78.784l9.823-12.63c8.138-10.463 6.253-25.542-4.21-33.679L288 256.349V152c0-13.255-10.745-24-24-24h-16c-13.255 0-24 10.745-24 24v135.651l65.409 50.874c10.463 8.137 25.541 6.253 33.679-4.21z"/></svg>
          Activity
        </button>
        <button class="nav-child active" data-filter="active">
          Queue<span class="nav-count" id="count-active" hidden></span>
        </button>
        <button class="nav-child" data-filter="all">
          History
        </button>
        <button class="nav-child" data-filter="failed">
          Failed<span class="nav-count" id="count-failed" hidden></span>
        </button>
      </div>

      <div class="sidebar-stats">
        <div><span>Active</span><b id="stat-active">0</b></div>
        <div><span>Completed</span><b id="stat-completed">0</b></div>
        <div><span>Failed</span><b id="stat-failed">0</b></div>
        <div><span>Downloaded</span><b id="stat-total">0 B</b></div>
      </div>

      <div class="sidebar-disks" id="sidebar-disks"></div>
    </nav>

    <main class="content">
      <div class="toolbar">
        <button class="toolbar-btn" id="btn-refresh">
          <svg viewBox="0 0 512 512" width="19" height="19" fill="currentColor"><path d="M440.65 12.57l4 82.77A247.16 247.16 0 0 0 255.83 8C134.73 8 33.91 94.92 12.29 209.82A12 12 0 0 0 24.09 224h49.05a12 12 0 0 0 11.67-9.26 175.91 175.91 0 0 1 317-56.94l-101.46-4.86a12 12 0 0 0-12.57 12v47.41a12 12 0 0 0 12 12H500a12 12 0 0 0 12-12V12a12 12 0 0 0-12-12h-47.37a12 12 0 0 0-11.98 12.57zM255.83 432a175.61 175.61 0 0 1-146-77.8l101.8 4.87a12 12 0 0 0 12.57-12v-47.4a12 12 0 0 0-12-12H12a12 12 0 0 0-12 12V500a12 12 0 0 0 12 12h47.35a12 12 0 0 0 12-12.6l-4.15-82.57A247.17 247.17 0 0 0 255.83 504c121.11 0 221.93-86.92 243.55-201.82a12 12 0 0 0-11.8-14.18h-49.05a12 12 0 0 0-11.67 9.26A175.86 175.86 0 0 1 255.83 432z"/></svg>
          <span>Refresh</span>
        </button>
        <span class="toolbar-sep" id="toolbar-sep" hidden></span>
        <button class="toolbar-btn" id="btn-retry-selected" hidden>
          <svg viewBox="0 0 512 512" width="19" height="19" fill="currentColor"><path d="M440.65 12.57l4 82.77A247.16 247.16 0 0 0 255.83 8C134.73 8 33.91 94.92 12.29 209.82A12 12 0 0 0 24.09 224h49.05a12 12 0 0 0 11.67-9.26 175.91 175.91 0 0 1 317-56.94l-101.46-4.86a12 12 0 0 0-12.57 12v47.41a12 12 0 0 0 12 12H500a12 12 0 0 0 12-12V12a12 12 0 0 0-12-12h-47.37a12 12 0 0 0-11.98 12.57zM255.83 432a175.61 175.61 0 0 1-146-77.8l101.8 4.87a12 12 0 0 0 12.57-12v-47.4a12 12 0 0 0-12-12H12a12 12 0 0 0-12 12V500a12 12 0 0 0 12 12h47.35a12 12 0 0 0 12-12.6l-4.15-82.57A247.17 247.17 0 0 0 255.83 504c121.11 0 221.93-86.92 243.55-201.82a12 12 0 0 0-11.8-14.18h-49.05a12 12 0 0 0-11.67 9.26A175.86 175.86 0 0 1 255.83 432z"/></svg>
          <span>Retry<br>Selected</span>
        </button>
        <button class="toolbar-btn" id="btn-remove-selected" hidden>
          <svg viewBox="0 0 352 512" width="16" height="16" fill="currentColor"><path d="M242.72 256l100.07-100.07c12.28-12.28 12.28-32.19 0-44.48l-22.24-22.24c-12.28-12.28-32.19-12.28-44.48 0L176 189.28 75.93 89.21c-12.28-12.28-32.19-12.28-44.48 0L9.21 111.45c-12.28 12.28-12.28 32.19 0 44.48L109.28 256 9.21 356.07c-12.28 12.28-12.28 32.19 0 44.48l22.24 22.24c12.28 12.28 32.2 12.28 44.48 0L176 322.72l100.07 100.07c12.28 12.28 32.2 12.28 44.48 0l22.24-22.24c12.28-12.28 12.28-32.19 0-44.48L242.72 256z"/></svg>
          <span>Remove<br>Selected</span>
        </button>
        <button class="toolbar-btn" id="btn-cancel-selected" hidden>
          <svg viewBox="0 0 512 512" width="19" height="19" fill="currentColor"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm96 328c0 8.8-7.2 16-16 16H176c-8.8 0-16-7.2-16-16V176c0-8.8 7.2-16 16-16h160c8.8 0 16 7.2 16 16v160z"/></svg>
          <span>Cancel<br>Selected</span>
        </button>
      </div>

      <table class="table" id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="alert" id="empty" hidden>
        <span id="empty-title">Queue is empty</span>
        <span class="alert-hint" id="empty-hint"></span>
      </div>

      <div class="pager" id="pager" hidden>
        <div class="pager-controls">
          <button class="pager-btn" data-page="first" title="First page">
            <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M0 436V76c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12v151.9L235.5 71.4C256.1 54.3 288 68.6 288 96v131.9L459.5 71.4C480.1 54.3 512 68.6 512 96v320c0 27.4-31.9 41.7-52.5 24.6L288 285.3V416c0 27.4-31.9 41.7-52.5 24.6L64 285.3V436c0 6.6-5.4 12-12 12H12c-6.6 0-12-5.4-12-12z"/></svg>
          </button>
          <button class="pager-btn" data-page="prev" title="Previous page">
            <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M11.5 280.6l192 160c20.6 17.2 52.5 2.8 52.5-24.6V96c0-27.4-31.9-41.8-52.5-24.6l-192 160c-15.3 12.8-15.3 36.4 0 49.2zm256 0l192 160c20.6 17.2 52.5 2.8 52.5-24.6V96c0-27.4-31.9-41.8-52.5-24.6l-192 160c-15.3 12.8-15.3 36.4 0 49.2z"/></svg>
          </button>
          <span class="pager-label" id="pager-label">1 / 1</span>
          <button class="pager-btn" data-page="next" title="Next page">
            <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M500.5 231.4l-192-160C287.9 54.3 256 68.6 256 96v320c0 27.4 31.9 41.8 52.5 24.6l192-160c15.3-12.8 15.3-36.4 0-49.2zm-256 0l-192-160C31.9 54.3 0 68.6 0 96v320c0 27.4 31.9 41.8 52.5 24.6l192-160c15.3-12.8 15.3-36.4 0-49.2z"/></svg>
          </button>
          <button class="pager-btn" data-page="last" title="Last page">
            <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M512 76v360c0 6.6-5.4 12-12 12h-40c-6.6 0-12-5.4-12-12V284.1L276.5 440.6c-20.6 17.2-52.5 2.8-52.5-24.6V284.1L52.5 440.6C31.9 457.8 0 443.4 0 416V96c0-27.4 31.9-41.7 52.5-24.6L224 226.8V96c0-27.4 31.9-41.7 52.5-24.6L448 226.8V76c0-6.6 5.4-12 12-12h40c6.6 0 12 5.4 12 12z"/></svg>
          </button>
        </div>
        <span class="pager-total" id="pager-total"></span>
      </div>

      <div class="foot" id="foot-config"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="/static/app.js"></script>
</body>
</html>
