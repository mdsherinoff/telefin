<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleFin</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 2 11 13'/%3E%3Cpath d='M22 2 15 22l-4-9-9-4Z'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4Z" />
      </svg>
    </div>
    <label class="header-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input type="search" id="search" placeholder="Search" autocomplete="off" />
    </label>
    <div class="conn" id="conn">
      <span class="dot"></span><span id="conn-label">connecting…</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="nav-group active">
        <button class="nav-parent" id="nav-parent">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Activity
        </button>
        <button class="nav-child active" data-filter="active">
          Queue<span class="nav-count" id="count-active" hidden></span>
        </button>
        <button class="nav-child" data-filter="all">
          History
        </button>
        <button class="nav-child" data-filter="failed">
          Failed<span class="nav-count" id="count-failed" hidden></span>
        </button>
      </div>

      <div class="sidebar-stats">
        <div><span>Active</span><b id="stat-active">0</b></div>
        <div><span>Completed</span><b id="stat-completed">0</b></div>
        <div><span>Failed</span><b id="stat-failed">0</b></div>
        <div><span>Downloaded</span><b id="stat-total">0 B</b></div>
      </div>

      <div class="sidebar-disks" id="sidebar-disks"></div>
    </nav>

    <main class="content">
      <div class="toolbar">
        <button class="toolbar-btn" id="btn-refresh">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span>Refresh</span>
        </button>
        <span class="toolbar-sep" id="toolbar-sep" hidden></span>
        <button class="toolbar-btn" id="btn-retry-selected" hidden>
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 3v6h6"/></svg>
          <span>Retry<br>Selected</span>
        </button>
        <button class="toolbar-btn" id="btn-remove-selected" hidden>
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          <span>Remove<br>Selected</span>
        </button>
        <button class="toolbar-btn" id="btn-cancel-selected" hidden>
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
          <span>Cancel<br>Selected</span>
        </button>
      </div>

      <table class="table" id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="alert" id="empty" hidden>
        <span id="empty-title">Queue is empty</span>
        <span class="alert-hint" id="empty-hint"></span>
      </div>

      <div class="pager" id="pager" hidden>
        <div class="pager-controls">
          <button class="pager-btn" data-page="first" title="First page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 17-5-5 5-5"/><path d="M7 6v12"/></svg>
          </button>
          <button class="pager-btn" data-page="prev" title="Previous page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
          </button>
          <span class="pager-label" id="pager-label">1 / 1</span>
          <button class="pager-btn" data-page="next" title="Next page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
          </button>
          <button class="pager-btn" data-page="last" title="Last page">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"/><path d="M17 6v12"/></svg>
          </button>
        </div>
        <span class="pager-total" id="pager-total"></span>
      </div>

      <div class="foot" id="foot-config"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="/static/app.js"></script>
</body>
</html>
